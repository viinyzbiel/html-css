<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi´dias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse siet em varios dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto_p.png">
        <source media="(max-width:1050px )" srcset="imagens/foto_m.png">
        <img src="imagens/foto_g.png" alt="Imagem flexível">
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5</p>
    <audio preload="metadata" controls autoplay loop> 
        <source src="midia/New Type of Hero(《凸變英雄X》動畫原聲帶) - Chatterbox (youtube).mp3" type="audio/mpeg">
        <source src="midia/New Type of Hero(《凸變英雄X》動畫原聲帶) - Chatterbox (youtube).ogg" type="audio/ogg">
        <source src="midia/New Type of Hero(《凸變英雄X》動畫原聲帶) - Chatterbox (youtube).wav" type="audio/wav">
        <p>Infelizmente seu navegador não consegue reproduzir áudio. <a href="midia/New Type of Hero(《凸變英雄X》動畫原聲帶) - Chatterbox (youtube).mp3">Clique aqui para baixar o arquivo MP3</a></p>
    </audio>
</body>
</html>
