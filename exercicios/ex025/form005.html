<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Sexo</legend>
           <input type="radio" name="sexo" id="isxmas" value="M" checked> <label for="isxmas">Masculino</label>
           <input type="radio" name="sexo" id="isxfem" value="F"> <label for="isxfem">Feminino</label>
        </fieldset>

        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="esbas" id="iesbas" checked> <label for="iesbas">Basquete <br></label>
            <input type="checkbox" name="esfut" id="iesfut" checked> <label for="iesfut">Futebol <br></label>
            <input type="checkbox" name="esnat" id="iesnat"> <label for="iesnat">Nataçao <br></label>
            <input type="checkbox" name="esten" id="iesten"> <label for="iesten">Tenís <br></label>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Reset">
        </p>
    </form>
</body>
</html>
